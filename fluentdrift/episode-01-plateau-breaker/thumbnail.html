<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FluentDrift - Episode 1 Thumbnail</title>
<!-- Open in Chrome, screenshot the .thumb element at 1280x720.
     DevTools > Device Toolbar > custom size 1280x720 gives a pixel-perfect export. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B1220;
    --black: #000000;
    --gold: #F5C84C;
    --red: #E63946;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
  }
  .thumb {
    position: relative;
    width: 1280px;
    height: 720px;
    background: radial-gradient(ellipse at 30% 50%, #142038 0%, var(--navy) 45%, var(--black) 100%);
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }

  /* left: breakthrough graphic */
  .burst {
    position: absolute;
    left: 60px;
    top: 50%;
    width: 520px;
    height: 520px;
    transform: translateY(-50%);
  }
  .ring {
    position: absolute;
    inset: 0;
    border: 4px solid var(--red);
    border-radius: 50%;
    opacity: 0.85;
    clip-path: polygon(0 0, 60% 0, 45% 20%, 65% 40%, 40% 55%, 60% 75%, 45% 95%, 0 100%);
    filter: drop-shadow(0 0 20px rgba(230,57,70,.5));
  }
  .ring.mid { inset: 60px; opacity: 0.55; border-width: 3px; }
  .ring.inner { inset: 120px; opacity: 0.35; border-width: 2px; }

  .wave {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 0;
    height: 0;
    border-radius: 50%;
    box-shadow:
      0 0 0 40px rgba(245,200,76,.9),
      0 0 0 80px rgba(245,200,76,.55),
      0 0 0 120px rgba(245,200,76,.3),
      0 0 0 170px rgba(245,200,76,.12),
      0 0 120px 60px rgba(245,200,76,.35);
  }

  .mouth {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 170px;
    height: 90px;
    background: #111;
    border-radius: 0 0 85px 85px;
    box-shadow: 0 -4px 0 4px #0f0f0f inset, -2px 0 10px rgba(245,200,76,.4);
    overflow: hidden;
  }
  .mouth::before {
    content: "";
    position: absolute;
    top: 40%;
    left: 15%;
    right: 15%;
    height: 10px;
    background: linear-gradient(to right, transparent, rgba(245,200,76,.7), transparent);
    border-radius: 50%;
  }

  /* right: text block */
  .text {
    position: absolute;
    right: 50px;
    top: 60px;
    bottom: 60px;
    width: 620px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 6px;
  }
  .text .line {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: 170px;
    line-height: 0.9;
    color: var(--white);
    letter-spacing: 0.5px;
    text-shadow: 6px 6px 0 rgba(0,0,0,.6);
  }
  .text .line.slash {
    position: relative;
    color: var(--white);
  }
  .text .line.slash::after {
    content: "";
    position: absolute;
    left: -10px;
    right: -10px;
    top: 50%;
    height: 10px;
    background: var(--red);
    transform: rotate(-6deg);
    box-shadow: 3px 3px 0 rgba(0,0,0,.5);
  }

  /* bottom-right stamp */
  .stamp {
    position: absolute;
    right: 48px;
    bottom: 40px;
    padding: 14px 26px;
    border: 5px solid var(--red);
    color: var(--red);
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    font-size: 44px;
    letter-spacing: 4px;
    transform: rotate(-8deg);
    background: rgba(0,0,0,.35);
    text-shadow: 0 2px 4px rgba(0,0,0,.6);
  }

  /* brand watermark */
  .brand {
    position: absolute;
    left: 44px;
    bottom: 36px;
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    color: var(--gold);
    font-size: 26px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.85;
  }

  /* subtle grain */
  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.06;
    background-image:
      radial-gradient(rgba(255,255,255,.6) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,.6) 1px, transparent 1px);
    background-size: 3px 3px, 3px 3px;
    background-position: 0 0, 1px 1px;
  }
</style>
</head>
<body>
  <div class="thumb">
    <!-- left graphic: breakthrough -->
    <div class="burst">
      <div class="wave"></div>
      <div class="ring inner"></div>
      <div class="ring mid"></div>
      <div class="ring"></div>
      <div class="mouth"></div>
    </div>

    <!-- right: 3-word punch overlay -->
    <div class="text">
      <div class="line">BREAK</div>
      <div class="line">THE</div>
      <div class="line slash">PLATEAU</div>
    </div>

    <!-- bottom-right stamp -->
    <div class="stamp">&#10060; B1</div>

    <!-- brand -->
    <div class="brand">FLUENTDRIFT</div>

    <div class="grain"></div>
  </div>
</body>
</html>
